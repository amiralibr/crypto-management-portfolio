name: Security & Paper Isolation Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  security-scan:
    name: Secret, Live-Trading, and Paper Isolation Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry and dependencies
        run: |
          pip install "poetry==2.5.1"
          poetry install --no-interaction

      - name: Run security and Paper isolation test suite
        env:
          ENVIRONMENT: development
          LOG_LEVEL: INFO
          APP_NAME: mvp0
          DATABASE_URL: postgresql+asyncpg://mvp0:change_me_local_only@localhost:5432/mvp0
          REDIS_URL: redis://localhost:6379/0
          MVP0_API_KEY: ci_operational_test_key_0000000001
          MVP0_ADMIN_API_KEY: ci_admin_test_secret_key_00000002
        run: poetry run pytest tests/security -o addopts=""

      - name: Check for forbidden live-trading or real exchange patterns
        run: |
          ! grep -RInE "api\.binance\.com|api\.bybit\.com|api\.okx\.com|ccxt\." app/ docker/ scripts/
          grep -q "LIVE_TRADING=false" .env.example
          grep -q "internal: true" docker-compose.paper.yml
