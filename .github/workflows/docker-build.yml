name: Docker Build & Compose Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Images & Verify Single Worker + Compose Startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f docker/Dockerfile -t mvp0-api:f1 .

      - name: Build Paper API Docker image
        run: docker build -f docker/Dockerfile.paper -t mvp0-paper-api:f1 .

      - name: Verify runtime command uses exactly one worker and non-root UID 10001
        run: |
          CMD_JSON=$(docker inspect mvp0-api:f1 --format '{{json .Config.Cmd}}')
          echo "Image CMD: $CMD_JSON"
          echo "$CMD_JSON" | grep -q '"--workers"'
          echo "$CMD_JSON" | grep -q '"1"'
          USER_VAL=$(docker inspect mvp0-api:f1 --format '{{.Config.User}}')
          echo "Image User: $USER_VAL"
          test "$USER_VAL" = "10001"
          docker run --rm mvp0-api:f1 python3 --version
          docker run --rm mvp0-api:f1 uvicorn --version
          docker run --rm mvp0-api:f1 alembic --version

      - name: Validate Development Docker Compose startup
        run: |
          docker compose up -d postgres redis api
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then
              echo ""
              echo "Development API ready!"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS http://127.0.0.1:8000/metrics | head -n 30
          docker compose ps
          docker compose logs api
          docker compose down -v

      - name: Validate Paper Docker Compose startup and isolation
        run: |
          docker compose -f docker-compose.paper.yml up -d
          HEALTHY=0
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.paper.yml ps -q paper_api))
            echo "Paper API health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -f docker-compose.paper.yml ps
            docker compose -f docker-compose.paper.yml logs
            exit 1
          fi
          docker compose -f docker-compose.paper.yml ps
          docker compose -f docker-compose.paper.yml logs paper_api
          docker network inspect mvp0_paper_network --format '{{.Internal}}' | grep -q "true"
          docker compose -f docker-compose.paper.yml down -v
