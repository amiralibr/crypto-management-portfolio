name: Docker Build & Compose Validation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker Images & Verify Single Worker + Compose Startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -f docker/Dockerfile -t mvp0-api:f2 .

      - name: Build Paper API Docker image
        run: docker build -f docker/Dockerfile.paper -t mvp0-paper-api:f2 .

      - name: Build Independent Kill Switch Docker image
        run: docker build -f docker/Dockerfile.kill-switch -t mvp0-kill-switch:f2 .

      - name: Verify runtime command uses exactly one worker and non-root UID 10001
        run: |
          for IMG in mvp0-api:f2 mvp0-kill-switch:f2; do
            CMD_JSON=$(docker inspect "$IMG" --format '{{json .Config.Cmd}}')
            echo "$IMG CMD: $CMD_JSON"
            echo "$CMD_JSON" | grep -q '"--workers"'
            echo "$CMD_JSON" | grep -q '"1"'
            USER_VAL=$(docker inspect "$IMG" --format '{{.Config.User}}')
            echo "$IMG User: $USER_VAL"
            test "$USER_VAL" = "10001"
          done
          docker run --rm mvp0-api:f2 python3 --version
          docker run --rm mvp0-api:f2 uvicorn --version
          docker run --rm mvp0-api:f2 alembic --version

      - name: Validate Development Docker Compose startup (API + Independent Kill Switch)
        run: |
          docker compose up -d postgres redis api kill_switch
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz && \
               docker compose exec -T kill_switch python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3)"; then
              echo ""
              echo "Development API (:8000) and Internal Kill Switch Service (:8001) ready!"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          docker compose exec -T kill_switch python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read().decode())"
          docker compose exec -T kill_switch python3 -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3).read().decode())"
          # Verify kill_switch does NOT publish host port 8001 and does NOT expose /api/v1/system/emergency-stop
          KS_PORTS=$(docker inspect --format='{{json .HostConfig.PortBindings}}' $(docker compose ps -q kill_switch))
          echo "kill_switch HostConfig.PortBindings: $KS_PORTS"
          test "$KS_PORTS" = "{}" -o "$KS_PORTS" = "null"
          docker compose exec -T kill_switch python3 -c 'import urllib.request, urllib.error; exec("try:\n urllib.request.urlopen(\"http://127.0.0.1:8001/api/v1/system/emergency-stop\", timeout=3)\n raise SystemExit(1)\nexcept urllib.error.HTTPError as e:\n assert e.code == 404, e.code\n print(\"Verified 404 on internal kill_switch /api/v1/system/emergency-stop\")")'
          curl -fsS http://127.0.0.1:8000/metrics | head -n 30
          docker compose ps
          docker compose logs api kill_switch
          docker compose down -v

      - name: Validate Paper Docker Compose startup and isolation (Paper API + Paper Kill Switch)
        run: |
          docker compose -f docker-compose.paper.yml up -d
          HEALTHY=0
          for i in $(seq 1 30); do
            API_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.paper.yml ps -q paper_api))
            KS_STATUS=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose -f docker-compose.paper.yml ps -q paper_kill_switch))
            echo "Paper API: $API_STATUS | Paper Kill Switch: $KS_STATUS"
            if [ "$API_STATUS" = "healthy" ] && [ "$KS_STATUS" = "healthy" ]; then
              HEALTHY=1
              break
            fi
            sleep 2
          done
          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -f docker-compose.paper.yml ps
            docker compose -f docker-compose.paper.yml logs
            exit 1
          fi
          docker compose -f docker-compose.paper.yml ps
          docker compose -f docker-compose.paper.yml logs paper_api paper_kill_switch
          docker network inspect mvp0_paper_network --format '{{.Internal}}' | grep -q "true"
          docker compose -f docker-compose.paper.yml down -v
